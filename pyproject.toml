[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesosfer-bear"
version = "0.1.0"
description = "Mesosfer Bear AI Engine and Tokenizer"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Mesosfer Team" }
]
dependencies = [
    "regex>=2023.10.3",
    "torch>=2.5.0,<3.0",
    "pyarrow>=12.0.0",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.13.0",
    "tokenizers>=0.22.2",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.5.0,<3.0",
]
cuda = [
    "torch>=2.5.0,<3.0",
]
gpu = [
    "torch>=2.5.0,<3.0",
]
rocm = [
    "torch>=2.5.0,<3.0",
    "pytorch-triton-rocm ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "gpu" },
        { extra = "rocm" },
    ],
]
